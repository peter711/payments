# Kafka and observability infrastructure for local development: run the Spring
# Boot services from the IDE (or Maven) against localhost:9092.
#
#   docker compose up -d
#
# UIs:
#   - Kafka UI  : http://localhost:8090
#   - Prometheus: http://localhost:9090
#   - Grafana   : http://localhost:3000  (anonymous admin; admin login from .env)
#   - Loki      : http://localhost:3100  (Grafana "Loki" datasource)
#   - Alertmanager: http://localhost:9093 (firing alerts, silences, inhibition)
#   - Mailpit   : http://localhost:8025  (alert emails land here)
#
# The services are expected on the host at the ports set in .run/ (9080/9081/
# 9082); Prometheus scrapes them via host.docker.internal. This file only brings
# up the infrastructure; use docker-compose.full.yml for the complete stack.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics the services rely on. Runs once, then exits, so the
  # services started from the IDE find the required topics already present.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in payments.requested payments.completed payments.failed payments.corrected \
                     payments.provider.events payments.requested.DLT payments.provider.events.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Kafka topics ready"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    # Required on Linux so the container can reach services running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Routes the Prometheus rules' firing alerts, groups and de-duplicates them and
  # delivers to the Mailpit SMTP sink below.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # Local email sink: Alertmanager sends alert mails over SMTP, the web UI at
  # :8025 shows the inbox. No external mail service needed.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Credentials come from .env (template: .env.example). No defaults here, so
      # a missing .env fails loudly instead of silently using a known password.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
      - loki
    restart: unless-stopped

  # Log aggregation for the full stacks: Loki stores, Alloy collects. In THIS
  # stack the application services run from the IDE on the host (not as
  # containers), so Alloy has nothing to tail; the services keep logging to the
  # IDE console. Loki is started anyway so the Grafana "Loki" datasource
  # resolves. Use docker-compose.full.yml (or k8s) for centralized logs.
  loki:
    image: grafana/loki:3.5.4
    container_name: loki
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    ports:
      - "12345:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.compose.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped