spring:
  application:
    name: notification-service
  config:
    # Shared Micrometer/Prometheus conventions from the payments-observability module.
    import: classpath:payments-observability.yml
  datasource:
    url: jdbc:h2:file:./data/notification-service;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.softfal.notification_service.kafka.EventEnvelopeDeserializer
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

logging:
  level:
    root: INFO
    com.softfal.notification_service: DEBUG
