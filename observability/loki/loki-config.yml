# Loki configuration for the payments demo stacks.
#
# Single-binary mode with filesystem storage: good enough for a local k3d /
# docker-compose evaluation stack, not for production. Retention is enforced by
# the compactor; the read and write paths live in one process.
#
# This file is the single source of truth for both stacks: docker-compose mounts
# it directly, and Kubernetes turns it into the `loki-config` ConfigMap
# (see observability/kustomization.yaml).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Local demo: keep a bounded amount of data around.
  retention_period: 168h
  # Allow the high-cardinality correlation fields to travel as structured
  # metadata instead of index labels.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
