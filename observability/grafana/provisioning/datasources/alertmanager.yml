apiVersion: 1

datasources:
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    # "alertmanager" is the service/container name in both compose stacks and in
    # Kubernetes, so the same provisioning works everywhere.
    url: http://alertmanager:9093
    isDefault: false
    editable: false
    jsonData:
      # Only the standalone Alertmanager is used; Grafana's own alerting is off.
      handleGrafanaManagedAlerts: false
      implementation: prometheus
