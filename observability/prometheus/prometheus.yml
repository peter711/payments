# Prometheus config for the IDE/dev stack (docker-compose.yml).
#
# The application services are started from the IDE on the host, so Prometheus
# (running in a container) reaches them through host.docker.internal. The ports
# match the -Dserver.port values in the .run/ run configurations.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Firing rules are delivered to Alertmanager, which owns routing/grouping/
# inhibition and forwards to the Mailpit sink.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9080"]
        labels:
          app: payment-api

  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9081"]
        labels:
          app: payment-processor

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9082"]
        labels:
          app: notification-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
