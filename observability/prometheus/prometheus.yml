# Prometheus config for the IDE/dev stack (docker-compose.yml).
#
# The application services are started from the IDE on the host, so Prometheus
# (running in a container) reaches them through host.docker.internal. The ports
# match the -Dserver.port values in the .run/ run configurations.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9080"]

  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9081"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
