# Prometheus config for the full containerized stack (docker-compose.full.yml).
#
# Every service runs as a container on the compose network, so targets are
# addressed by service name on the container port (8080). Reaching each replica
# of a scaled service is not possible with static config; this stack runs one
# container per service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Firing rules are delivered to Alertmanager, which owns routing/grouping/
# inhibition and forwards to the Mailpit sink.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-api:8080"]
        labels:
          app: payment-api

  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-processor:8080"]
        labels:
          app: payment-processor

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8080"]
        labels:
          app: notification-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Self-monitoring: the meta-alerts (Watchdog, notification failures) read
  # Alertmanager's metrics.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
