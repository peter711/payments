# Full local stack: Kafka, topic bootstrap, Kafka UI and the three Spring Boot
# services built from the repository root Dockerfile.
#
# This is an alternative to docker-compose.yml, which only runs Kafka/Kafka UI
# for developing the services from the IDE.
#
#   docker compose -f docker-compose.full.yml up --build
#
# Host ports are deliberately different from the IDE/dev setup (docker-compose.yml
# uses 9092 / 8090 / 8080) so it is unambiguous which stack you are talking to:
#   - Kafka UI : http://localhost:18090
#   - payment-api : http://localhost:18080
#   - Prometheus : http://localhost:19090
#   - Grafana : http://localhost:13000  (anonymous admin; admin login from .env)
#   - Loki : http://localhost:13100  (Grafana "Loki" datasource; logs via Alloy)
#   - Alertmanager : http://localhost:19093  (firing alerts, silences, inhibition)
#   - Mailpit : http://localhost:18025  (alert emails land here)
#   - Kafka (host listener) : localhost:29092
#
# Service-to-service traffic uses the INTERNAL listener (kafka:19092); the HOST
# listener is only advertised on localhost:29092 for host tooling.
name: payments-full

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topics the services rely on. Runs once, then exits; the services
  # wait for it to complete before starting.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in payments.requested payments.completed payments.failed payments.requested.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        echo "Kafka topics ready"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "18090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.full.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Routes the Prometheus rules' firing alerts, groups and de-duplicates them and
  # delivers to the Mailpit SMTP sink below.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "19093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # Local email sink: Alertmanager sends alert mails over SMTP, the web UI shows
  # the inbox. No external mail service needed.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "18025:8025"
      - "11025:1025"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    ports:
      - "13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Credentials come from .env (template: .env.example). No defaults here, so
      # a missing .env fails loudly instead of silently using a known password.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.4
    ports:
      - "13100:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    restart: unless-stopped

  # Tails the application container logs (ECS JSON) and forwards them to Loki.
  alloy:
    image: grafana/alloy:v1.20.1
    ports:
      - "12345:12345"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.compose.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-api
    ports:
      - "18080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # ECS JSON logs, collected by the Alloy service and stored in Loki.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  payment-processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-processor
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # ECS JSON logs, collected by the Alloy service and stored in Loki.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - payment-processor-data:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # ECS JSON logs, collected by the Alloy service and stored in Loki.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - notification-service-data:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  payment-processor-data:
  notification-service-data:
