spring:
  application:
    name: payment-api
  config:
    # Shared Micrometer/Prometheus conventions from the payments-observability module.
    import: classpath:payments-observability.yml
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

payment:
  gateway:
    # mock (default) keeps the local pipeline self-contained and hides the
    # webhook endpoint; stripe exposes POST /webhooks/stripe and requires the
    # signing secret below.
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    root: INFO
    com.softfal.payment_api: DEBUG