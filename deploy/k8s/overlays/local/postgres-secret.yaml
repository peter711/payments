# Local k3d only. The base manifests reference a "postgres-credentials" Secret
# but ship no values, so the plaintext development credentials live exclusively
# in this overlay. Deployments on a real cluster must provision this Secret
# out-of-band (see base/postgres/secret.example.yaml and deploy/k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
stringData:
  username: payments
  password: payments
