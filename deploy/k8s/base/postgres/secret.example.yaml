# Template for the Secret the base manifests expect. This file is NOT referenced
# by kustomization.yaml and must never be committed with real values.
#
# Provision it out-of-band, for example:
#
#   kubectl -n payments create secret generic postgres-credentials \
#     --from-literal=username=payments \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# The local k3d overlay ships its own development copy in
# overlays/local/postgres-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
