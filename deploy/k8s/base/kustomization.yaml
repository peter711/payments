apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payments

resources:
  - namespace.yaml
  - kafka/service.yaml
  - kafka/statefulset.yaml
  - kafka-init/job.yaml
  - kafka-ui/deployment.yaml
  - kafka-ui/service.yaml
  - kafka-ui/ingress.yaml
  # The postgres-credentials Secret is intentionally not part of the base: it is
  # provisioned out-of-band (see postgres/secret.example.yaml) and the local
  # overlay ships a development copy.
  - postgres/service.yaml
  - postgres/statefulset.yaml
  # Generated ConfigMaps for Prometheus/Grafana live next to the compose files
  # in observability/ (single source of truth for both stacks).
  - ../../../observability
  - monitoring/prometheus/serviceaccount.yaml
  - monitoring/prometheus/rbac.yaml
  - monitoring/prometheus/deployment.yaml
  - monitoring/prometheus/service.yaml
  # Alert delivery: Alertmanager (routing/grouping/inhibition) plus Mailpit as
  # the local SMTP sink that Alertmanager sends to.
  - monitoring/alertmanager/deployment.yaml
  - monitoring/alertmanager/service.yaml
  - monitoring/alertmanager/ingress.yaml
  - monitoring/mailpit/deployment.yaml
  - monitoring/mailpit/service.yaml
  - monitoring/mailpit/ingress.yaml
  - monitoring/grafana/deployment.yaml
  - monitoring/grafana/service.yaml
  - monitoring/grafana/ingress.yaml
  # Log aggregation: Loki (storage/query) and Alloy (log collection DaemonSet).
  - monitoring/loki/service.yaml
  - monitoring/loki/statefulset.yaml
  - monitoring/alloy/serviceaccount.yaml
  - monitoring/alloy/rbac.yaml
  - monitoring/alloy/daemonset.yaml
  - apps/payment-api/deployment.yaml
  - apps/payment-api/service.yaml
  - apps/payment-api/ingress.yaml
  - apps/payment-api/pdb.yaml
  - apps/payment-api/hpa.yaml
  - apps/payment-processor/deployment.yaml
  - apps/payment-processor/service.yaml
  - apps/payment-processor/pdb.yaml
  - apps/payment-processor/hpa.yaml
  - apps/notification-service/deployment.yaml
  - apps/notification-service/service.yaml
  - apps/notification-service/pdb.yaml
  - apps/notification-service/hpa.yaml
