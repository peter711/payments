apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  # Headless-style stable DNS for the StatefulSet; Grafana and Alloy address it
  # as http://loki:3100 from inside the namespace.
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
