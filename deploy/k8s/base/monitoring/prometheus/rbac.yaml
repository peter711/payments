# Prometheus discovers scrape targets through the Kubernetes API
# (kubernetes_sd_configs, pod role), so it needs read access to pods and (for
# the default service/endpoint metadata) services and endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payments-prometheus
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payments-prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: payments-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: payments
