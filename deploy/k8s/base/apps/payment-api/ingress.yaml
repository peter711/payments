apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api
  labels:
    app: payment-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: payments.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-api
                port:
                  number: 80
