# Template for the Secret the payment services reference when the Stripe gateway
# is enabled. This file is NOT referenced by kustomization.yaml and must never be
# committed with real values.
#
# Provision it out-of-band, for example:
#
#   kubectl -n payments create secret generic stripe-credentials \
#     --from-literal=api-key=sk_test_REPLACE_ME \
#     --from-literal=webhook-secret=whsec_REPLACE_ME
#
# Then set PAYMENT_GATEWAY_PROVIDER=stripe on the payment-api Deployment (the
# webhook host) and payment-processor. A missing secret is tolerated (the
# reference is optional), so the default mock-based deployment needs nothing
# extra.
apiVersion: v1
kind: Secret
metadata:
  name: stripe-credentials
  labels:
    app: payment-processor
type: Opaque
stringData:
  api-key: REPLACE_ME
  webhook-secret: REPLACE_ME
